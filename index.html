  --clay:#E0824C; --clay-ink:#241209; --clay-soft:#3A2A1E;
  --ok:#6FBF8B; --ok-soft:#22352A; --bad:#E08874; --bad-soft:#3A241E;
  --warn:#D9B85C; --warn-soft:#37301C;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .s{font-size:.78rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.btn{padding:12px 18px;font-weight:600}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn-clay{background:var(--clay);color:var(--clay-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:1.7rem;margin-bottom:8px}
.hero p{margin:0;color:var(--muted)}
.kicker{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.sect{margin:26px 0 12px}
.sect h2{font-size:1.15rem}
.sect .sub{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow)}
.card:hover{border-color:var(--acc)}
.card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.chip-ind{background:var(--acc-soft);color:var(--acc)}
.chip-eq{background:var(--clay-soft);color:var(--clay)}
.chip-best{background:var(--surface2);color:var(--muted)}
.card h3{font-size:1.02rem}
.card .desc{font-size:.88rem;color:var(--muted);margin:0}
.card .meta{font-size:.78rem;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:14px 0 18px}
.progress>div{height:100%;background:var(--acc);border-radius:99px;transition:width .3s ease}
.qcount{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.situ{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.situ .paso{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);margin-bottom:6px}
.situ p{margin:0 0 6px}
.situ .preg{font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;color:var(--ink);line-height:1.4;font-size:.95rem}
.opt:not([disabled]):hover{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-ok{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default;opacity:.92}
.feedback{border-radius:12px;padding:13px 14px;margin-top:12px;font-size:.93rem}
.fb-ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb-mid{background:var(--warn-soft);border:1px solid var(--warn)}
.fb-bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb-tag{font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:3px}
.nav-next{margin-top:16px;display:flex;justify-content:flex-end}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center;box-shadow:var(--shadow)}
.result .nivel{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;margin:6px 0 2px}
.result .pts{font-size:2.6rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.result .de{font-size:.9rem;color:var(--muted)}
.stats{display:flex;justify-content:center;gap:18px;margin:14px 0;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.codebox{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px;margin:16px 0 8px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85rem;word-break:break-all;text-align:left;line-height:1.5}
.codebox .lbl{font-family:"Instrument Sans",sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;display:block;margin-bottom:6px}
.note{font-size:.82rem;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.linkrow{margin-top:26px;text-align:center}
.linkbtn{background:none;border:none;color:var(--muted);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.docente{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.docente h3{margin-bottom:8px}
.docente p{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.val-out{margin-top:12px;border-radius:12px;padding:13px;font-size:.9rem}
.val-out table{width:100%;border-collapse:collapse;font-size:.88rem}
.val-out td{padding:4px 6px;vertical-align:top}
.val-out td:first-child{font-weight:600;white-space:nowrap;color:var(--muted)}
#qrbox,.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;margin-top:10px}
.back{background:none;border:none;color:var(--acc);font-weight:600;font-size:.9rem;padding:6px 0;display:inline-flex;align-items:center;gap:5px}
.ctx{background:var(--surface2);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:.93rem}
.ctx .ct{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);display:block;margin-bottom:5px}
.footer{margin-top:36px;text-align:center;font-size:.78rem;color:var(--muted)}
.card.locked{opacity:.6;box-shadow:none}
.card.locked:hover{border-color:var(--line)}
.chip-lock{background:var(--surface2);color:var(--muted)}
.toggles{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.toggles label{display:flex;align-items:flex-start;gap:10px;font-size:.92rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);margin:0;cursor:pointer}
.toggles input{width:auto;margin-top:3px;accent-color:var(--acc)}
.msg{font-size:.85rem;margin-top:10px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

{t:"Cuantitativo: una encuesta a 400 personas para tener datos representativos.",p:0,f:"Una encuesta te diría CUÁNTOS no regresan, pero difícilmente el porqué profundo. Primero hay que explorar motivos con enfoque cualitativo."},

q:"¿Qué enfoque corresponde?",
o:[{t:"Cuantitativo: el objetivo es medir una frecuencia en la población.",p:10,f:"Correcto. Medir porcentajes y frecuencias con representatividad es tarea cuantitativa: instrumento estandarizado y muestra probabilística."},
{t:"Cualitativo: unas sesiones de grupo bastarían para estimar el porcentaje.",p:0,f:"Las sesiones de grupo no producen porcentajes generalizables: su muestra es pequeña y no probabilística."},
{t:"Mixto: empezar con sesiones de grupo y después encuestar.",p:5,f:"Combinar enfoques es válido, pero si el objetivo ya está definido como MEDIR una frecuencia, el camino directo es cuantitativo."}]},
{s:"En la junta de capacitación, tu jefe pregunta por las características de la metodología cualitativa.",
q:"¿Cuál de estas afirmaciones es correcta?",
o:[{t:"Es inductiva: parte de los datos para desarrollar comprensión, y es flexible.",p:10,f:"Correcto. La metodología cualitativa es inductiva, flexible y empírica: construye comprensión a partir de lo observado."},
{t:"Busca generalizar resultados a toda la población con muestras grandes.",p:0,f:"Eso describe al enfoque cuantitativo. La cualitativa busca profundidad y comprensión, no generalización estadística."},
{t:"Exige instrumentos estandarizados que no pueden modificarse en campo.",p:0,f:"Al contrario: la flexibilidad es una de sus características. Las guías se ajustan conforme se aprende del sujeto de estudio."}]},
{s:"Un cliente duda de invertir en un estudio cualitativo y pide que le expliques qué gana.",
q:"¿Cuál es un beneficio real de la investigación cualitativa?",
o:[{t:"Da profundidad a los datos, contextualiza el entorno y captura detalles y experiencias únicas.",p:10,f:"Correcto. Profundidad, contexto y una visión fresca, natural y holística de los fenómenos: eso aporta la cualitativa."},
{t:"Garantiza precisión estadística con margen de error conocido.",p:0,f:"La precisión estadística es terreno cuantitativo. La cualitativa aporta comprensión, no márgenes de error."},
{t:"Elimina por completo el sesgo del investigador.",p:0,f:"Ningún enfoque elimina el sesgo; en la cualitativa el investigador es el instrumento y por eso se documenta y se reconoce como limitación."}]},
{s:"Un gerente comenta: “la investigación cualitativa no sirve porque sus resultados no son representativos”.",
q:"¿Cuál es la mejor respuesta profesional?",
o:[{t:"“No busca representatividad estadística: busca comprender motivaciones y significados. Ambos enfoques se complementan.”",p:10,f:"Correcto. Cada enfoque responde preguntas distintas; muchas investigaciones combinan una fase cualitativa y una cuantitativa."},
{t:"“Tiene razón: solo la cuantitativa produce información útil.”",p:0,f:"Falso. Sin la cualitativa no entenderías motivos, emociones ni contextos: información clave para decidir en mercadotecnia."},
{t:"“Sí es representativa siempre que entrevistes a más de 30 personas.”",p:0,f:"El número de entrevistas no convierte un estudio cualitativo en representativo: su muestreo no es probabilístico ni lo pretende."}]},
{s:"Tu equipo diseñará un cuestionario para un estudio grande, pero nadie conoce aún cómo habla y piensa el consumidor de dulces regionales.",
q:"¿Cómo conviene combinar los enfoques?",
o:[{t:"Fase cualitativa exploratoria primero, para descubrir lenguaje y motivos, y con eso diseñar el cuestionario cuantitativo.",p:10,f:"Correcto. Es la combinación clásica: la cualitativa explora y alimenta el diseño del instrumento cuantitativo."},
{t:"Siempre va primero la encuesta; lo cualitativo es solo un adorno final.",p:0,f:"Encuestar sin explorar produce preguntas mal planteadas con el lenguaje del investigador, no el del consumidor."},
{t:"Nunca deben combinarse: son metodologías incompatibles.",p:0,f:"Sí pueden combinarse y diseñarse de manera que conjuguen una parte cuantitativa y otra cualitativa."}]},
{s:"Estás clasificando el material que generó el estudio piloto.",
q:"¿Cuáles de estos son datos típicamente cualitativos?",
o:[{t:"Notas de campo, grabaciones de entrevistas y narraciones de los participantes.",p:10,f:"Correcto. La investigación cualitativa extrae descripciones de observaciones: entrevistas, narraciones, notas de campo, grabaciones."},
{t:"Porcentajes de preferencia y tablas de frecuencias.",p:0,f:"Frecuencias y porcentajes son resultados cuantitativos."},

{s:"Para cerrar la capacitación, tu jefe pregunta dónde encaja la investigación de mercados dentro de la empresa.",
q:"La investigación de mercados es un subsistema de…",
o:[{t:"El sistema de información de mercadotecnia (SIM), junto al subsistema interno, el de inteligencia y el analítico.",p:10,f:"Correcto. El SIM integra subsistemas interrelacionados que procesan datos para apoyar la planeación, ejecución y control."},
{t:"El departamento de contabilidad, porque maneja datos.",p:0,f:"No: manejar datos no lo hace contable. Es parte del sistema de información de mercadotecnia."},
{t:"El área de ventas, porque de ahí salen los reportes.",p:0,f:"Los reportes de ventas alimentan el subsistema interno; la investigación de mercados es otro subsistema del SIM, con enfoque estratégico."}]}

{t:"Observación encubierta en cafeterías.",p:0,f:"Observar no te dice cómo cambia la percepción interna de las mismas personas a lo largo del tiempo."}]},
{s:"Una cadena de carnicerías sospecha que la atención al cliente varía mucho entre sucursales y quiere evaluarla tal como la vive un cliente común.",
q:"¿Qué técnica aplica?",
o:[{t:"Comprador misterioso con guion y criterios de evaluación definidos.",p:10,f:"Correcto. El mystery shopper vive la experiencia como cliente real y la registra contra estándares de servicio definidos."},
{t:"Encuesta de salida en cada sucursal.",p:5,f:"Da percepciones de clientes, pero es cuantitativa y el personal se comporta distinto si sabe que se evalúa. El misterioso ve la operación real."},
{t:"Entrevistar a los empleados sobre su propio servicio.",p:0,f:"El empleado difícilmente reporta sus fallas; necesitas la vivencia del cliente, no la autoevaluación del personal."}]},
{s:"En las entrevistas sobre una marca de harina, notas que la gente no puede o no quiere expresar directamente lo que siente hacia la marca.",
q:"¿Qué recurso usas?",
o:[{t:"Técnicas proyectivas: asociación de palabras, frases incompletas o personificación de la marca.",p:10,f:"Correcto. Las proyectivas rodean la barrera racional: el participante 'proyecta' actitudes que no expresaría de forma directa."},
{t:"Pedirle al entrevistado que sea más honesto.",p:0,f:"No es falta de honestidad: muchas actitudes no son conscientes o son socialmente incómodas. Se necesita una técnica indirecta."},
{t:"Cambiar a un cuestionario de opción múltiple.",p:0,f:"Cerrar las preguntas reduce aún más la expresión; es el camino contrario."}]},
{s:"Van a rentar una cámara de Gesell para el estudio de la dulcería.",
q:"¿Para qué sirve la cámara de Gesell?",
o:[{t:"Permite que el equipo y el cliente observen la sesión de grupo sin ser vistos, a través de un espejo unidireccional.",p:10,f:"Correcto. La cámara de Gesell tiene dos ambientes separados por un espejo de visión unilateral: en uno sucede la sesión, en el otro se observa y registra."},
{t:"Es un equipo para grabar audio de alta fidelidad en campo.",p:0,f:"No es un equipo de audio: es un espacio de dos ambientes con espejo unidireccional para observar sin interferir."},
{t:"Sirve para entrevistar a dos personas al mismo tiempo.",p:0,f:"El número de entrevistados no tiene que ver: es una sala de observación no intrusiva."}]},
{s:"Tu equipo hará observación dentro de una tienda (espacio privado) y registrará comportamiento de clientes.",
q:"¿Cuál es la conducta ética correcta?",
o:[{t:"Contar con autorización del establecimiento, no grabar rostros sin permiso y resguardar la identidad de las personas.",p:10,f:"Correcto. La generación y resguardo de información exige ética y responsabilidad: autorización, anonimato y uso exclusivo para la investigación."},
{t:"Grabar de forma oculta: es válido porque es para una investigación escolar.",p:0,f:"Que sea escolar no elimina la obligación ética: en espacios privados se requiere autorización y respeto a la identidad de las personas."},
{t:"Publicar los videos en redes como evidencia del trabajo.",p:0,f:"Los registros de campo son confidenciales: se usan para el análisis, nunca para exhibir a personas."}]}
]},
{
id:"T3", seccion:"tema", etiqueta:"Tema 3 · Proceso de investigación de mercados", modo:"individual",
titulo:"El proceso maestro",
desc:"Acompaña a “Dulces La Uresana” por los pasos del proceso de investigación con enfoque cualitativo, del planteamiento a las limitaciones.",
contexto:"“Dulces La Uresana”, fábrica artesanal de Ures, vende bien a familias y turistas, pero casi nada a los jóvenes de Hermosillo. Te contrataron para dirigir el proceso completo de investigación cualitativa. Cada paso del proceso es una decisión.",
pasos:[
{s:"Paso 1 · Planteamiento del problema. El dueño dice: “el problema es que necesitamos más publicidad”.",
q:"¿Cuál es el mejor planteamiento del problema?",
o:[{t:"“Se desconocen las percepciones y motivaciones de los jóvenes de 18 a 25 años de Hermosillo respecto a los dulces regionales, lo que impide diseñar estrategias para ese segmento.”",p:10,f:"Correcto. Un buen planteamiento delimita qué se desconoce, en quién, dónde y por qué importa. No adelanta soluciones."},
{t:"“El problema es que falta publicidad en redes sociales.”",p:0,f:"Eso es una solución disfrazada de problema. Si partes de ahí, la investigación nace sesgada."},
{t:"“Los jóvenes ya no valoran nada de lo regional.”",p:0,f:"Es un juicio sin evidencia, no un planteamiento: prejuzga el resultado antes de investigar."}]},
{s:"Paso 2 · Definición de los objetivos. Toca redactar el objetivo general del estudio.",
q:"¿Cuál es un objetivo de investigación cualitativa bien formulado?",
o:[{t:"“Comprender las percepciones, asociaciones y ocasiones de consumo de los dulces regionales entre jóvenes de 18 a 25 años de Hermosillo.”",p:10,f:"Correcto. Verbos como comprender, explorar o descubrir corresponden al enfoque cualitativo, con sujeto y ámbito delimitados."},
{t:"“Medir el porcentaje de jóvenes que compra dulces regionales cada mes.”",p:0,f:"'Medir porcentajes' es un objetivo cuantitativo; no corresponde al enfoque de este estudio."},
{t:"“Aumentar las ventas 20% en el segmento joven durante el próximo año.”",p:0,f:"Ese es un objetivo de negocio, no de investigación. La investigación produce comprensión, no ventas directas."}]},
{s:"Paso 3 · Investigación preliminar. El equipo quiere salir a entrevistar mañana mismo.",
q:"¿Qué haces primero?",
o:[{t:"Revisar fuentes secundarias: datos de INEGI, estudios previos sobre consumo de dulces, redes sociales de la marca y de la competencia.",p:10,f:"Correcto. La investigación preliminar aprovecha lo que ya existe: contexto, cifras y antecedentes que afinan el problema antes del campo."},
{t:"Salir directo al campo: la información secundaria es una pérdida de tiempo.",p:0,f:"Sin exploración preliminar repetirás lo ya sabido y llegarás al campo con preguntas pobres."},
{t:"Contratar un censo del municipio.",p:0,f:"Un censo es carísimo e innecesario: la fase preliminar usa información existente, no levantamientos masivos."}]},
{s:"Paso 4 · Formulación de la hipótesis. En un estudio cualitativo la hipótesis funciona como supuesto de trabajo.",
q:"¿Cuál es un supuesto adecuado para este estudio?",
o:[{t:"“Los jóvenes asocian los dulces regionales con ocasiones familiares y de nostalgia, no con su consumo cotidiano.”",p:10,f:"Correcto. Es un supuesto explorable con técnicas cualitativas: orienta la guía de entrevista sin encasillar el resultado."},
{t:"“El 63% de los jóvenes prefiere dulces importados con un nivel de confianza del 95%.”",p:0,f:"Esa es una hipótesis estadística de un estudio cuantitativo; aquí no hay muestreo probabilístico que la pruebe."},
{t:"En lo cualitativo está prohibido formular cualquier supuesto.",p:0,f:"No está prohibido: se formulan supuestos de trabajo flexibles que se ajustan conforme avanza el estudio."}]},
{s:"Paso 5 · Diseño de la investigación. Hay que definir el tipo de estudio.",
q:"¿Qué diseño corresponde?",
o:[{t:"Diseño exploratorio-cualitativo: entrevistas a profundidad y sesiones de grupo con jóvenes del segmento.",p:10,f:"Correcto. El diseño se alinea al objetivo: explorar y comprender pide técnicas cualitativas en un diseño exploratorio."},
{t:"Diseño experimental con grupo de control y placebo.",p:0,f:"Los experimentos prueban causa-efecto en condiciones controladas; no es lo que este objetivo pide."},
{t:"Encuesta descriptiva a 400 hogares.",p:0,f:"Ese es un diseño cuantitativo descriptivo; contradice el objetivo de comprensión profunda."}]},
{s:"Paso 6 · Fuentes de información. El equipo clasifica lo que usará.",
q:"¿Cuál clasificación es correcta?",
o:[{t:"Primarias: las entrevistas y sesiones que realizaremos. Secundarias: censos de INEGI, estudios publicados y contenido de redes.",p:10,f:"Correcto. Primaria es la información que generas para tu estudio; secundaria, la que ya existía publicada."},
{t:"Primarias: lo que salga en Google. Secundarias: nuestras entrevistas.",p:0,f:"Está invertido: lo que generas tú es primario; lo ya publicado es secundario."},
{t:"Todas las fuentes son iguales, no vale la pena distinguirlas.",p:0,f:"Distinguirlas importa: cambia cómo citas, cómo evalúas confiabilidad y qué te falta por generar."}]},
{s:"Paso 7 · Características del sujeto de estudio. Hay que definir a quién estudiar.",
q:"¿Cuál es la mejor definición del sujeto de estudio?",
o:[{t:"Jóvenes de 18 a 25 años, residentes de Hermosillo, que conozcan los dulces regionales, incluyendo consumidores y no consumidores.",p:10,f:"Correcto. Define edad, lugar y criterio de inclusión; incluir no consumidores es clave: son justo quienes explican el problema."},
{t:"“Todo público”, para no dejar fuera a nadie.",p:0,f:"Sin delimitación no hay estudio: el sujeto se define con las características que exige el problema."},
{t:"Los empleados de la dulcería, porque son fáciles de reunir.",p:0,f:"La facilidad no es criterio: los empleados no son el segmento cuyo comportamiento quieres comprender."}]},
{s:"Paso 8 · Diseño del instrumento. Toca construir la herramienta de recolección.",
q:"¿Qué instrumento diseñas?",
o:[{t:"Una guía de tópicos con preguntas abiertas, flexible, organizada de lo general a lo específico.",p:10,f:"Correcto. El instrumento cualitativo es una guía flexible de temas y preguntas abiertas, no un cuestionario rígido."},
{t:"Un cuestionario cerrado con escala del 1 al 5.",p:0,f:"Las escalas cerradas son instrumentos cuantitativos; aquí cortarían la profundidad que buscas."},
{t:"Nada: la flexibilidad cualitativa significa improvisar en el momento.",p:0,f:"Flexibilidad no es improvisación: sin guía olvidarás temas clave y cada entrevista será incomparable con las demás."}]},
{s:"Paso 9 · Trabajo de campo. Todo listo para levantar la información.",
q:"¿Cuál es la mejor práctica antes y durante el levantamiento?",
o:[{t:"Pilotear la guía con una o dos personas, pedir consentimiento informado y grabar solo con autorización.",p:10,f:"Correcto. El piloto detecta preguntas confusas y el consentimiento protege a los participantes y al estudio."},
{t:"Aplicar directo la primera versión de la guía: el piloto retrasa.",p:0,f:"Sin piloto descubrirás los errores de la guía cuando ya quemaste entrevistados reales."},
{t:"Grabar sin avisar para que la gente actúe natural.",p:0,f:"Grabar sin consentimiento viola la ética de la investigación; la naturalidad se logra con rapport, no con engaño."}]},
{s:"Paso 10 · Análisis e interpretación de resultados. Terminaste 12 entrevistas y 2 sesiones de grupo.",
q:"¿Cómo se analiza correctamente el material cualitativo?",
o:[{t:"Transcribir, codificar el contenido, agrupar códigos en categorías y temas, y respaldar cada hallazgo con citas textuales.",p:10,f:"Correcto. El análisis cualitativo es sistemático: transcripción, codificación, categorías y verbatims que sustentan cada conclusión."},
{t:"Promediar las respuestas y sacar porcentajes de cada opinión.",p:0,f:"Promediar 12 entrevistas no produce estadística válida ni respeta la naturaleza del dato cualitativo."},
{t:"Quedarse con la opinión que más se repitió y descartar el resto.",p:0,f:"La frecuencia no es el único criterio: una idea dicha por una persona puede ser el insight más valioso del estudio."}]},
{s:"Paso 11 · Limitaciones. El reporte está casi listo.",
q:"¿Qué haces con las limitaciones del estudio?",
o:[{t:"Declararlas con honestidad: resultados no generalizables estadísticamente, posibles sesgos y alcance geográfico del estudio.",p:10,f:"Correcto. Reconocer limitaciones da credibilidad profesional al informe y orienta el uso correcto de los hallazgos."},
{t:"Omitirlas para que el trabajo se vea más sólido.",p:0,f:"Ocultarlas es una falta de ética profesional; toda investigación tiene limitaciones y declararlas fortalece el reporte."},
{t:"Inventar un nivel de confianza del 95% para darle formalidad.",p:0,f:"Inventar cifras estadísticas en un estudio cualitativo es fabricar datos: la falta más grave en investigación."}]}
]},
/* ---------- MISIONES POR PRÁCTICA (equipo) ---------- */
{
id:"P2", seccion:"practica", etiqueta:"Práctica 2 · Técnica de observación", modo:"equipo",
titulo:"Misión en Magdalena de Kino",
desc:"Diseñen y ejecuten una observación etnográfica —física y digital— de la vocación productiva del municipio.",
contexto:"Su equipo consultor fue asignado a Magdalena de Kino. La misión: observar la plaza Monumental en fin de semana y hacer etnografía digital de los grupos de Facebook del municipio, para detectar oportunidades alrededor de sus productos y tradiciones.",
pasos:[
{s:"Antes de salir a campo, el equipo debe acordar qué se va a observar.",
q:"¿Cuál es el mejor objetivo de observación?",
o:[{t:"“Observar los comportamientos de compra y consumo de productos regionales en la plaza Monumental durante el fin de semana.”",p:10,f:"Correcto. Un objetivo de observación delimita conductas, lugar y momento. Con eso se construye la guía."},
{t:"“Observar todo lo que pase en Magdalena.”",p:0,f:"'Todo' no es observable: sin delimitación, las notas de campo serán un caos inutilizable."},
{t:"“Contar los coches que entran al municipio.”",p:0,f:"Ese dato de aforo no responde a la misión: buscan comportamiento de compra y consumo, no tráfico."}]},
{s:"Discuten qué tipo de observación realizar en la plaza.",
q:"¿Qué modalidad conviene?",
o:[{t:"No participante y estructurada: observar sin intervenir, con una guía de categorías definidas.",p:10,f:"Correcto. No intervienen en la escena y llevan guía: así el registro es comparable entre observadores del equipo."},
{t:"Participante encubierta: hacerse pasar por vendedores sin avisarle a nadie.",p:0,f:"Encubrirse sin necesidad ni autorización cruza la línea ética y arriesga la misión."},
{t:"Mejor entrevistar: la observación es poco científica.",p:0,f:"La observación es una técnica cualitativa legítima; además la misión pide conducta real, no discurso."}]},
{s:"Toca construir la guía de observación física.",
q:"¿Qué categorías debe incluir la guía?",
o:[{t:"Símbolos y estética, rituales y comportamientos, lenguaje y narrativas, actores y redes.",p:10,f:"Correcto. Son las categorías de una guía etnográfica: qué se ve, qué se hace, qué se dice y quiénes influyen."},
{t:"Una lista de precios de los productos de la plaza.",p:0,f:"Los precios son un dato puntual, no una guía de observación de comportamiento y cultura."},
{t:"Preguntas de opinión para aplicar a los visitantes.",p:0,f:"Si preguntas, ya no es observación: es entrevista. No mezclen los instrumentos."}]},
{s:"Para la etnografía digital, el equipo entra a los grupos de Facebook del municipio.",
q:"¿Qué deben observar ahí?",
o:[{t:"Narrativas e historias que se cuentan, iconografía que se repite, eventos y rutinas, y quiénes son las voces influyentes.",p:10,f:"Correcto. La etnografía digital observa símbolos, rituales, lenguaje y actores de la comunidad en línea."},
{t:"Solo contar los likes de cada publicación.",p:5,f:"Los likes son una señal, pero quedarse ahí es superficial: lo valioso está en narrativas, símbolos y actores."},
{t:"Publicar en el grupo una encuesta pidiendo que respondan.",p:0,f:"Eso ya no es observación y además intervienen la comunidad sin autorización del estudio."}]},
{s:"Definen cómo registrar lo observado en la plaza.",
q:"¿Cuál es el registro correcto?",
o:[{t:"Notas de campo con fecha, hora y contexto, más fotos de espacios y productos con autorización, sin captar rostros identificables.",p:10,f:"Correcto. El registro sistemático y respetuoso es lo que convierte una visita en datos analizables."},
{t:"Confiar en la memoria y escribir todo al llegar a Hermosillo.",p:0,f:"La memoria pierde y distorsiona detalles en horas: las notas se toman en el momento o inmediatamente después."},
{t:"Grabar video de las personas sin avisar, para que salga natural.",p:0,f:"Grabar personas identificables sin consentimiento viola la ética del estudio."}]},
{s:"En plena observación, un locatario se acerca y pregunta con desconfianza qué están haciendo.",
q:"¿Cómo responde el equipo?",
o:[{t:"Se identifican como estudiantes de la UTH, explican el estudio y le piden su autorización para continuar.",p:10,f:"Correcto. Transparencia y respeto: además, un locatario que entiende el proyecto suele volverse un gran informante."},
{t:"Dicen que son turistas tomando fotos.",p:0,f:"Mentir compromete la ética del estudio y, si se descubre, cierra las puertas del municipio al proyecto."},
{t:"Se retiran de inmediato sin dar explicaciones.",p:5,f:"Retirarse evita el conflicto, pero pierde la oportunidad de legitimar el trabajo y ganar un aliado. Mejor: identificarse."}]},
{s:"De regreso, las notas dicen: “las familias compran dulces y artesanías como regalo para llevar a parientes de otras ciudades, casi nunca para consumir ahí mismo”.",
q:"¿Qué conclusión útil extrae el equipo?",
o:[{t:"Hay una oportunidad alrededor del formato regalo: empaque, presentación y narrativa de 'orgullo de Magdalena' para llevar.",p:10,f:"Correcto. Eso es un insight accionable: conecta el comportamiento observado con una decisión de producto para el proyecto."},
{t:"“La gente compra cosas en la plaza.”",p:0,f:"Eso ya se sabía sin investigar: una conclusión debe agregar comprensión, no describir lo obvio."},
{t:"Fijar de una vez el precio final del producto del proyecto.",p:0,f:"El precio no sale de una observación: excede el alcance de esta técnica y de esta etapa."}]}
]},
{
id:"P3", seccion:"practica", etiqueta:"Práctica 3 · Entrevista a profundidad", modo:"equipo",
titulo:"La maestra artesana de Álamos",
desc:"Consigan una entrevista a profundidad con doña Refugio, artesana con 40 años de oficio, sin quemar la oportunidad.",
contexto:"Doña Refugio, maestra artesana de Álamos, aceptó darles una hora de su tiempo. Es la informante clave de su investigación: conoce el oficio, el pueblo y a los compradores. Una entrevista mal llevada no se repite.",
pasos:[
{s:"Faltan tres días para la entrevista.",
q:"¿Cómo se prepara el equipo?",
o:[{t:"Elaboran la guía de tópicos, investigan la trayectoria de doña Refugio, prueban la grabadora y definen quién entrevista y quién registra.",p:10,f:"Correcto. Una entrevista a profundidad se gana en la preparación: guía, contexto del informante, equipo probado y roles claros."},
{t:"No preparan nada: la espontaneidad es lo cualitativo.",p:0,f:"Confundir flexibilidad con improvisación cuesta caro: sin guía olvidarán los temas centrales del estudio."},
{t:"Redactan 30 preguntas cerradas para no perder tiempo.",p:0,f:"Treinta preguntas cerradas convierten la entrevista en interrogatorio: matan la profundidad que buscan."}]},
{s:"Llegan a su taller. Doña Refugio los recibe algo seria.",
q:"¿Cómo abren la entrevista?",
o:[{t:"Conversación ligera para generar rapport, explican el propósito del estudio y piden su consentimiento para grabar.",p:10,f:"Correcto. Rapport + propósito + consentimiento: la apertura construye la confianza de la que depende toda la entrevista."},
{t:"Van directo a la pregunta más delicada: “¿cuánto gana usted al mes?”.",p:0,f:"Abrir con lo íntimo sin confianza previa cierra al informante, a veces de forma definitiva."},
{t:"Le ofrecen un pago extra si da respuestas 'útiles' para el proyecto.",p:0,f:"Pagar por respuestas 'correctas' contamina el dato y es una falta ética grave."}]},
{s:"Toca la primera pregunta importante sobre su oficio.",
q:"¿Cuál es la mejor pregunta?",
o:[{t:"“Platíqueme, ¿cómo aprendió usted este oficio?”",p:10,f:"Correcto. Abierta, narrativa y neutral: invita a contar una historia, que es donde viven los insights."},
{t:"“¿Verdad que sus artesanías son las mejores de la región?”",p:0,f:"Pregunta dirigida: sugiere la respuesta y solo produce cortesía, no información."},
{t:"“¿Vende mucho? ¿Sí o no?”",p:0,f:"Cerrada: se responde con un monosílabo y no abre ninguna puerta."}]},
{s:"Le preguntan por los compradores jóvenes y responde solo: “casi no vienen”.",
q:"¿Qué hace el entrevistador?",
o:[{t:"Sondea: “¿me puede contar más sobre eso? ¿Cómo era antes, qué cree que cambió?”",p:10,f:"Correcto. El sondeo (probing) convierte respuestas cortas en relatos: es la habilidad central del entrevistador a profundidad."},
{t:"Pasa a la siguiente pregunta de la guía.",p:5,f:"Avanzar es cómodo, pero acaban de pasar de largo un tema central del estudio. Primero se profundiza, luego se avanza."},
{t:"Responde por ella: “seguro es por el internet, ¿verdad?”.",p:0,f:"Poner palabras en boca del informante sesga el dato: la hipótesis del equipo no se sugiere, se explora."}]},
{s:"Tras una pregunta sobre el futuro del oficio, doña Refugio se queda callada varios segundos.",
q:"¿Cómo se maneja el silencio?",
o:[{t:"Lo toleran con calma: el silencio invita a elaborar, y suele venir seguido de lo más valioso.",p:10,f:"Correcto. El silencio es herramienta del entrevistador: quien lo respeta, cosecha reflexión; quien lo llena, la interrumpe."},
{t:"Lo llenan de inmediato con otra pregunta para evitar la incomodidad.",p:5,f:"Comprensible, pero interrumpe la reflexión del informante justo cuando estaba por decir algo importante."},
{t:"Dan por terminada la entrevista: ya se incomodó.",p:0,f:"Un silencio no es incomodidad terminal: abandonarla desperdicia a la informante clave del estudio."}]},
{s:"Doña Refugio lleva diez minutos hablando de un pleito familiar sin relación con el estudio.",
q:"¿Qué procede?",
o:[{t:"Redirigir con amabilidad: “qué interesante lo que cuenta; volviendo a sus compradores, ¿quiénes valoran más su trabajo?”",p:10,f:"Correcto. Redirigir sin brusquedad conserva el rapport y recupera la guía de tópicos."},
{t:"Interrumpir en seco: “eso no nos sirve, volvamos al tema”.",p:0,f:"La brusquedad rompe el rapport construido; el costo es mayor que los minutos perdidos."},
{t:"Dejar que consuma la hora completa: sería grosero intervenir.",p:0,f:"La cortesía extrema también falla: se van sin los temas del estudio y la oportunidad no se repite."}]},
{s:"Durante toda la entrevista, además de la grabadora…",
q:"¿Qué debe registrar el segundo integrante?",
o:[{t:"Lenguaje no verbal: gestos, pausas, cambios de tono, objetos que muestra, y el contexto del taller.",p:10,f:"Correcto. Lo no verbal comunica tanto como las palabras: emociones, orgullo, incomodidad. La grabadora no lo captura."},
{t:"Nada: con la grabadora es suficiente.",p:0,f:"El audio pierde gestos, miradas y contexto: la mitad de la información de una entrevista presencial."},
{t:"Su opinión personal sobre si doña Refugio 'tiene razón' o no.",p:0,f:"El registro documenta, no juzga: las opiniones del equipo van después, separadas, en el análisis."}]},
{s:"La entrevista terminó. Tienen 58 minutos de audio.",
q:"¿Cuál es el siguiente paso correcto?",
o:[{t:"Transcribir el audio (por ejemplo con Whisper en Colab), codificar el texto y extraer citas textuales para el análisis.",p:10,f:"Correcto. Transcripción fiel, codificación y verbatims: así la entrevista se convierte en evidencia analizable para el reporte."},
{t:"Resumir de memoria lo que 'más o menos' dijo.",p:0,f:"El resumen de memoria distorsiona: las conclusiones deben poder rastrearse hasta las palabras textuales."},
{t:"Editar las citas para que digan lo que el equipo esperaba encontrar.",p:0,f:"Alterar citas es fabricar datos: invalida el estudio y es la falta ética más grave del oficio."}]}
]},
{
id:"P4", seccion:"practica", etiqueta:"Práctica 4 · Sesión de grupo", modo:"equipo",
titulo:"El focus del queso regional",
desc:"Diseñen y moderen una sesión de grupo para evaluar el concepto de un queso regional de Ures con empaque premium.",

const $app = document.getElementById("app");
let state = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ---- Código de evidencia corto (10 caracteres) ---- */
const KEY = "KINO-URES-2026";
const AB = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"; // sin 0, O, 1, I para evitar confusiones al dictar
const CODE_IDS = ["T1","T2","T3","P2","P3","P4","P5","P6"]; // solo AGREGAR al final; nunca reordenar
function normName(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function h32(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } h^=h>>>13; h=Math.imul(h,0x5bd1e995)>>>0; h^=h>>>15; return h>>>0; }
function hoyDias(){ const n=new Date(); const d=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2026,0,1))/86400000); return Math.max(0,Math.min(4095,d)); }
function macDe(scnIdx,score,dias,grpIdx,nombre){ return h32([1,scnIdx,score,dias,grpIdx,normName(nombre),KEY].join("|")) & 0x7FFFFF; }
function makeShortCode(scnId,nombre,grupo,score){
  const scnIdx = CODE_IDS.indexOf(scnId); if(scnIdx<0) return null;
  const grpIdx = Math.max(0, GRUPOS.indexOf(grupo));
  const dias = hoyDias();
  const sc = Math.max(0,Math.min(127,score));
  let v = 0n;
  v=(v<<2n)|1n; v=(v<<4n)|BigInt(scnIdx); v=(v<<7n)|BigInt(sc); v=(v<<12n)|BigInt(dias); v=(v<<2n)|BigInt(grpIdx); v=(v<<23n)|BigInt(macDe(scnIdx,sc,dias,grpIdx,nombre));
  let s=""; for(let k=0;k<10;k++){ s=AB[Number(v&31n)]+s; v>>=5n; }
  return s.slice(0,5)+"-"+s.slice(5);
}
function readShortCode(code,nombre){
  try{
    const cl = String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(cl.length!==10) return null;
    let v=0n;
    for(const ch of cl){ const k=AB.indexOf(ch); if(k<0) return null; v=(v<<5n)|BigInt(k); }
    const mac=Number(v&0x7FFFFFn); v>>=23n;
    const grpIdx=Number(v&3n); v>>=2n;
    const dias=Number(v&4095n); v>>=12n;
    const score=Number(v&127n); v>>=7n;
    const scnIdx=Number(v&15n); v>>=4n;
    const ver=Number(v&3n);
    if(ver!==1 || scnIdx>=CODE_IDS.length) return null;
    if(mac!==macDe(scnIdx,score,dias,grpIdx,nombre)) return null;
    const f=new Date(Date.UTC(2026,0,1)+dias*86400000).toISOString().slice(0,10);
    return {scn:CODE_IDS[scnIdx], grupo:GRUPOS[grpIdx], pts:score, fecha:f};
  }catch(e){ return null; }
}

/* ---- Vistas ---- */
function nivel(pct){
  if(pct>=90) return ["Consultor(a) Senior","Dominio sobresaliente del proceso. Nivel profesional."];
  if(pct>=75) return ["Consultor(a) Junior","Buen dominio; revisa la retroalimentación de tus errores."];
  if(pct>=60) return ["Analista en formación","Vas en camino: repasa el tema y vuelve a intentar la misión."];
  return ["Practicante","La misión requiere repaso. Vuelve al material del tema y reintenta."];
}
function bestKey(id){ return "mc_best_"+id; }
function esDocente(){ try{ return sessionStorage.getItem("mc_teacher")==="1"; }catch(e){ return false; } }
function activo(id){ return CONFIG.activos===null || CONFIG.activos.includes(id); }
function claveOk(){
  if(esDocente() || claveMem) return true;
  return (lsGet("mc_clave")||"").trim().toUpperCase()===String(CONFIG.clave).toUpperCase();
}

function portada(){
  $app.innerHTML = `
    <div class="topbar"><div class="brand"><span class="t">Misión Cualitativa</span><span class="s">Simulador · SIM II · De Sonora para el mundo</span></div></div>
    <div class="hero">
      <span class="kicker">Acceso del grupo</span>
      <h1>Escribe la clave de tu grupo</h1>
      <p>Tu profesor te da la clave en clase. Solo necesitas escribirla una vez en este dispositivo.</p>
    </div>
    <form id="cfrm">
      <div class="field"><label for="cin">Clave de grupo</label><input id="cin" autocomplete="off" placeholder="La clave dada en clase"></div>
      <button type="submit" class="btn btn-acc btn-block">Entrar</button>
      <div class="msg" id="cmsg"></div>
    </form>
    <div class="linkrow"><button class="linkbtn" id="goDoc">Acceso docente</button></div>`;
  document.getElementById("cfrm").addEventListener("submit",e=>{
    e.preventDefault();
    const v = document.getElementById("cin").value.trim();
    if(v && v.toUpperCase()===String(CONFIG.clave).toUpperCase()){
      claveMem = true; lsSet("mc_clave", v);
      home();
    } else {
      document.getElementById("cmsg").textContent = "Clave incorrecta. Pídesela a tu profesor.";
    }
  });
  document.getElementById("goDoc").addEventListener("click",docente);
  window.scrollTo(0,0);
}

function home(){
  state=null;
  if(!claveOk()){ portada(); return; }
  const secTema = SCN.filter(s=>s.seccion==="tema");
  const secPrac = SCN.filter(s=>s.seccion==="practica");
  const doc = esDocente();
  const card = s=>{
    const best = lsGet(bestKey(s.id));
    const on = activo(s.id);
    if(!on && !doc){
      return `<div class="card locked">
        <div class="row1">
          <span class="chip chip-lock">🔒 Bloqueada</span>
          <span class="chip chip-best">${esc(s.etiqueta)}</span>
        </div>
        <h3>${esc(s.titulo)}</h3>
        <p class="desc">Esta misión se activará cuando el grupo avance al tema correspondiente.</p>
      </div>`;
    }
    return `<button class="card" data-go="${s.id}">
      <div class="row1">
        <span class="chip ${s.modo==="equipo"?"chip-eq":"chip-ind"}">${s.modo==="equipo"?"Equipo":"Individual"}</span>
        <span class="chip chip-best">${esc(s.etiqueta)}</span>
        ${!on?`<span class="chip chip-lock">Oculta para alumnos</span>`:""}

    </div>

      ${equipo? `

      <div class="field"><label for="f2">Grupo</label><select id="f2">${GRUPOS.map(g=>`<option>${g}</option>`).join("")}</select></div>

      `}

        <button type="button" class="btn btn-ghost btn-block" id="libre">Practicar sin registrar (sin código)</button>
      </div>
    </form>`;

    state = {s, i:0, score:0, ok:0, mid:0, bad:0, quien, grupo, qcode: qcode||quien,
      orden: s.pasos.map(p=>{ const idx=p.o.map((_,k)=>k); for(let j=idx.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[idx[j],idx[r]]=[idx[r],idx[j]];} return idx; })};

function paso(){
  const {s,i,orden} = state;
  const p = s.pasos[i];
  const pct = Math.round(i/s.pasos.length*100);
  $app.innerHTML = `
    <div class="topbar"><div class="brand"><span class="t">${esc(s.titulo)}</span><span class="s">${esc(s.etiqueta)}</span></div>
    <span class="qcount">${i+1} / ${s.pasos.length}</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="situ">
      ${p.s.startsWith("Paso")?`<div class="paso">${esc(p.s.split(".")[0])}</div><p>${esc(p.s.split(".").slice(1).join(".").trim())}</p>`:`<p>${esc(p.s)}</p>`}
      <p class="preg">${esc(p.q)}</p>
    </div>
    <div class="opts" id="opts">
      ${orden[i].map(k=>`<button class="opt" data-k="${k}">${esc(p.o[k].t)}</button>`).join("")}
    </div>
    <div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>elegir(parseInt(b.dataset.k,10),b)));
  window.scrollTo(0,0);
}

function elegir(k, btn){
  const {s,i} = state;
  const p = s.pasos[i];
  const op = p.o[k];
  state.score += op.p;
  if(op.p>=10){state.ok++;} else if(op.p>0){state.mid++;} else {state.bad++;}
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const kk = parseInt(b.dataset.k,10);
    if(kk===k) b.classList.add(op.p>=10?"sel-ok":op.p>0?"sel-mid":"sel-bad");
    else if(p.o[kk].p>=10 && op.p<10) b.classList.add("reveal-ok");
  });
  const cls = op.p>=10?"fb-ok":op.p>0?"fb-mid":"fb-bad";
  const tag = op.p>=10?"✔ Decisión correcta · +10 pts":op.p>0?"◐ Parcialmente correcta · +"+op.p+" pts":"✘ Decisión equivocada · +0 pts";
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${cls}"><span class="fb-tag">${tag}</span>${esc(op.f)}</div>
    <div class="nav-next"><button class="btn btn-acc" id="next">${i+1<s.pasos.length?"Siguiente decisión →":"Ver mi resultado"}</button></div>`;
  const nx = document.getElementById("next");
  nx.addEventListener("click",()=>{ state.i++; state.i<s.pasos.length? paso() : resultado(); });
  nx.focus();
}

function resultado(){
  const {s,score,ok,mid,bad,quien,grupo} = state;
  const max = s.pasos.length*10;
  const pct = Math.round(score/max*100);
  const [niv,msg] = nivel(pct);
  const prev = parseInt(lsGet(bestKey(s.id))||"0",10);
  if(pct>prev) lsSet(bestKey(s.id), String(pct));
  const fecha = new Date().toISOString().slice(0,10);
  let codeHTML = "";
  let code = null;
  if(quien){
    code = makeShortCode(s.id, state.qcode, grupo, score);
    codeHTML = `
    <div class="codebox"><span class="lbl">Código de evidencia · entrégalo a tu profesor</span><span style="font-size:1.35rem;letter-spacing:.08em">${esc(code)}</span></div>
    <a class="btn btn-acc btn-block" style="display:block;text-align:center;text-decoration:none" href="${esc(formLink(code, grupo, state.qcode, s.etiqueta+" — "+s.titulo, score+" / "+max))}" target="_blank" rel="noopener">Registrar mi actividad en el formulario</a>
    <button class="btn btn-ghost btn-block" id="copiar">Copiar código</button>
    <p class="note" style="margin-top:10px">El botón abre el formulario de reporte con todos los datos ya escritos (grupo, ${s.modo==="equipo"?"equipo":"nombre"}, escenario y código): revisa y envía.${s.modo==="equipo"?" En modo equipo se registra el NOMBRE DEL EQUIPO; cada integrante envía su propio registro con este mismo código.":""} El código va amarrado al ${s.modo==="equipo"?"nombre de equipo":"nombre"} <b>${esc(state.qcode)}</b>, al grupo, al puntaje y a la fecha; el profesor lo valida en la app y no funciona con otro nombre.</p>`;
  } else {
    codeHTML = `<p class="note" style="margin-top:14px"><b>No se generó código de evidencia</b> porque entraste con la opción “Practicar sin registrar”. Es normal: ese modo es solo para practicar. Cuando quieras entregar evidencia, repite la misión y en la pantalla inicial escribe tu ${s.modo==="equipo"?"equipo y grupo":"nombre y grupo"}, y usa el botón “Comenzar la misión”.</p>`;
  }
  $app.innerHTML = `
    <div class="result">
      <span class="kicker">${esc(s.titulo)} · Misión completada${quien? " · "+esc(quien):""}</span>
      <div class="pts">${score}<span style="font-size:1.1rem;color:var(--muted)"> / ${max}</span></div>
      <div class="nivel">${niv}</div>
      <p class="de">${esc(msg)}</p>
      <div class="stats"><span>Correctas <b>${ok}</b></span><span>Parciales <b>${mid}</b></span><span>Falladas <b>${bad}</b></span></div>
      ${codeHTML}
      <div class="actions">
        <button class="btn btn-acc btn-block" id="otra">Elegir otra misión</button>
        <button class="btn btn-ghost btn-block" id="rep">Repetir esta misión</button>
      </div>
    </div>`;
  const cop = document.getElementById("copiar");
  if(cop) cop.addEventListener("click",async ()=>{
    try{ await navigator.clipboard.writeText(code); cop.textContent="Código copiado ✔"; }
    catch(e){ cop.textContent="Selecciónalo y cópialo manualmente"; }
  });
  document.getElementById("otra").addEventListener("click",home);
  document.getElementById("rep").addEventListener("click",()=>intro(s.id));
  window.scrollTo(0,0);
}

    const r = readShortCode(document.getElementById("valin").value, nm);
    if(!r){ out.innerHTML = `<div class="val-out fb-bad"><b>Código inválido.</b> O el código está mal capturado o alterado, o no corresponde a ese nombre. Verifica ambos tal como aparecen en la evidencia del alumno.</div>`; return; }
    const scn = SCN.find(x=>x.id===r.scn);
    const max = scn ? scn.pasos.length*10 : 0;
    const pct = max ? Math.round(r.pts/max*100) : 0;

    const vistos = {};
    const res = filas.map((fila,idx)=>{
      let cells = fila.split("\t").map(c=>c.trim().replace(/^"|"$/g,"")).filter(c=>c);
      if(cells.length<2) cells = fila.split(/[;,]/).map(c=>c.trim().replace(/^"|"$/g,"")).filter(c=>c);
      const candidatos = cells.filter(c=>{ const cl=c.toUpperCase().replace(/[^A-Z0-9]/g,""); return cl.length===10 && [...cl].every(ch=>AB.includes(ch)); });
      if(!candidatos.length) return {idx, estado:"sin-codigo"};
      for(const cand of candidatos){
        for(const cell of cells){
          if(cell===cand) continue;
          const r = readShortCode(cand, cell);
          if(r){
            const clave = cand.toUpperCase().replace(/[^A-Z0-9]/g,"");
            const dup = vistos[clave];
            if(dup===undefined) vistos[clave]=idx+1;
            const scn = SCN.find(x=>x.id===r.scn);

          }
        }
      }
      return {idx, estado:"invalido"};
    });
    const okN = res.filter(r=>r.estado==="ok"||r.estado==="eq").length, dupN = res.filter(r=>r.estado==="dup").length, badN = res.length-okN-dupN;
    const filasHTML = res.map(r=>{
      if(r.estado==="ok" || r.estado==="dup" || r.estado==="eq"){
        const marca = r.estado==="dup" ? ` <span style="color:var(--bad);font-weight:700">⚠ código repetido (fila ${r.dupDe}) — posible copia</span>` : r.estado==="eq" ? ` <span style="color:var(--muted)">✔ mismo equipo que fila ${r.dupDe}</span>` : ` <span style="color:var(--ok)">✔</span>`;
        return `<tr><td style="color:var(--muted)">${r.idx+1}</td><td>${esc(r.nombre)}</td><td>${esc(r.prac)}</td><td style="font-variant-numeric:tabular-nums"><b>${r.calif}</b> (${r.pts}/${r.max})</td><td>${esc(r.fecha)}${marca}</td></tr>`;
      }
      const txt = r.estado==="sin-codigo" ? "sin código en la fila" : "código inválido o nombre no coincide";
      return `<tr><td style="color:var(--muted)">${r.idx+1}</td><td colspan="3" style="color:var(--bad)">✘ ${txt}</td><td></td></tr>`;
    }).join("");
    out.innerHTML = `
      <div class="val-out" style="background:var(--surface2)"><b>${okN} válidos</b> · ${dupN} repetidos · ${badN} con problema, de ${res.length} filas
      <div style="overflow-x:auto;margin-top:8px"><table>
      <tr><td>#</td><td><b>Nombre / Equipo</b></td><td><b>Práctica</b></td><td><b>Calif.</b></td><td><b>Fecha</b></td></tr>${filasHTML}</table></div>
      <button class="btn btn-ghost" id="mascopy" style="margin-top:10px">Copiar resultados para Excel</button></div>`;
    document.getElementById("mascopy").addEventListener("click",async ()=>{
      const tsv = res.map(r=> (r.estado==="ok"||r.estado==="dup"||r.estado==="eq")
        ? [r.nombre, r.prac, r.calif, r.estado==="dup"?("REPETIDO fila "+r.dupDe):r.estado==="eq"?("OK equipo, fila "+r.dupDe):"OK"].join("\t")
        : ["", "", "", r.estado==="sin-codigo"?"SIN CÓDIGO":"INVÁLIDO"].join("\t")).join("\n");
      const b = document.getElementById("mascopy");
      try{ await navigator.clipboard.writeText(tsv); b.textContent="Copiado ✔ (una fila por alumno, en el mismo orden)"; }
      catch(e){ b.textContent="No se pudo copiar automáticamente; selecciona la tabla y cópiala manualmente"; }
    });
  });
  document.getElementById("qrbtn").addEventListener("click",()=>{
    const w = document.getElementById("qrwrap");
    w.innerHTML = `<div class="qrbox" role="img" aria-label="Código QR del enlace de la app">${QR_SVG}</div><p class="note" style="text-align:center;word-break:break-all">${esc(APP_URL)}</p>`;
  });
  document.getElementById("qrfbtn").addEventListener("click",()=>{
    const w = document.getElementById("qrfwrap");
    w.innerHTML = `<div class="qrbox" role="img" aria-label="Código QR del formulario de reporte">${QR_FORM}</div><p class="note" style="text-align:center;word-break:break-all">${esc(FORM_SHORT)}</p>`;
  });
  window.scrollTo(0,0);
}

home();
</script>
